# Runs on every pull request and every push to main. Branch protection on
# main requires the `test` job to pass before a pull request can be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy for the browser demo
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test
      - name: The crate still packages and builds on its own
        run: cargo package --locked
      - name: Documentation pages match their source
        run: |
          cd docs && python3 _content.py >/dev/null
          git diff --exit-code -- . ':!demo'
