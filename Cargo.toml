[package]
name = "just-tui"
version = "0.2.0"
edition = "2024"

[lib]
name = "just_tui"
path = "src/lib.rs"
# cdylib is what wasm-bindgen needs; rlib is what the binary links against.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "just-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Natively ratatui talks to a real terminal through crossterm; in a browser
# there is none, and crossterm does not build for wasm at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratatui = { version = "0.30.2", default-features = false }
ratzilla = "0.3.1"
# ratatui-core reaches for critical-section, which has no implementation on a
# bare wasm target until one is chosen. The std one is right for a browser:
# one thread, and no interrupts to mask.
critical-section = { version = "1.2", features = ["std"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
