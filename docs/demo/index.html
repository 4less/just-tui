<style>
  :root {
    --canvas: #0a1422; --fg: #dae3f7; --dim: #8d909d;
    --outline: #3a4150; --primary: #7aa2f7;
    --bar: 42px;
    /* One character cell. The font below is chosen to match it. */
    --cell: 20px;
  }
  * { box-sizing: border-box; }

  /* The page must not scroll. Ratzilla does not call preventDefault, so an
     arrow key would move the cursor and the window both. */
  html, body { height: 100%; overflow: hidden; }
  /* The mono stack lives here, not on #terminal: the backend measures a
     sample cell against the inherited font, and inheriting it from further up
     is what makes that measurement succeed rather than fall back to a
     default that leaves the grid smaller than the window. */
  body {
    margin: 0; background: var(--canvas); color: var(--fg);
    font-family: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
    /* The backend measures a sample cell and falls back to 10x20px when the
       measurement comes back empty. These numbers make the real cell that
       size — a 0.6-advance monospace at 16.67px is 10px wide — so the grid
       fills the window whether the measurement succeeds or not. */
    font-size: 16.67px;
    line-height: 20px;
  }
  header, header * { font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.5; }
  header kbd { font-family: ui-monospace, monospace; }

  header {
    height: var(--bar);
    display: flex; align-items: center; gap: 0.9rem; flex-wrap: nowrap;
    padding: 0 0.9rem; border-bottom: 1px solid var(--outline);
    overflow: hidden; white-space: nowrap;
  }
  header .brand { font-weight: 700; }
  header .brand .just { background: var(--primary); color: #002e6b; padding: 0.15rem 0.35rem; border-radius: 4px; }
  header .hint { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  header .stamp {
    color: var(--dim); font-family: ui-monospace, monospace; font-size: 11px;
    border: 1px solid var(--outline); border-radius: 3px; padding: 0 0.35rem;
  }
  header .spacer { flex: 1; }
  header a { color: var(--primary); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  kbd {
    background: #2c3345; color: var(--primary); border: 1px solid var(--outline);
    border-radius: 3px; padding: 0 0.25rem;
    font: 700 11px/1.6 ui-monospace, monospace;
  }

  /* An explicit height, because the backend measures this element to decide
     how many rows and columns it has. Sized from the body it would grow to
     fit its own output, and then grow again. */
  #terminal {
    /* A whole row spare. The backend rounds the row count up against this
       box, and the row it gains is clipped by the overflow — which costs the
       bottom line of the interface, the one with the keys on it. */
    height: calc(100vh - var(--bar) - 20px);
    overflow: hidden;
    /* No padding: the backend measures this box to count rows and columns,
       and padding is inside it — every pixel of it costs a row off the
       bottom. An explicit line-height keeps the cell size predictable. */
    padding: 0;
  }
  /* Each row is a <pre>, and the browser gives those a 1em margin by
     default — which doubles the height of every row, so the grid needs twice
     the space the backend measured for it and runs off the bottom. */
  #terminal pre { margin: 0; padding: 0; }
  #terminal:focus, #terminal :focus { outline: none; }
</style>
